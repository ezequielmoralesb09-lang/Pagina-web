<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GTA VI | Mapa de Leonida</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: white;
        }

        header {
            background: #111;
            padding: 20px 40px;
            border-bottom: 2px solid #ff8c00;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        header h1 {
            color: #ff8c00;
            font-size: 26px;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        nav a:hover {
            color: #ff8c00;
        }

        .hero {
            text-align: center;
            padding: 55px 20px 30px;
        }

        .hero h2 {
            font-size: 42px;
            margin-bottom: 15px;
            color: #ff8c00;
        }

        .hero p {
            color: #bbb;
            line-height: 1.6;
        }

        .map-container {
            max-width: 1100px;
            margin: 30px auto 60px;
            padding: 0 20px;
        }

        .map-box {
            background: #151515;
            padding: 15px;
            border: 1px solid #333;
            border-radius: 12px;
            box-shadow: 0 10px 35px #0008;
        }

        .map-box img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 6px;
        }

        .map-caption {
            text-align: center;
            color: #aaa;
            margin-top: 18px;
            font-size: 14px;
        }

        .map-button {
            display: block;
            width: fit-content;
            margin: 25px auto 0;
            padding: 13px 24px;
            background: #ff8c00;
            color: #111;
            text-decoration: none;
            font-weight: bold;
            border-radius: 7px;
            transition: 0.3s;
        }

        .map-button:hover {
            background: #ffad33;
            transform: scale(1.04);
        }

        footer {
            text-align: center;
            padding: 25px;
            background: #111;
            color: #777;
            border-top: 1px solid #222;
        }

        @media (max-width: 600px) {
            header {
                justify-content: center;
                text-align: center;
            }

            nav {
                justify-content: center;
                gap: 15px;
            }

            .hero h2 {
                font-size: 32px;
            }

            .map-container {
                padding: 0 10px;
            }

            .map-box {
                padding: 7px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>GTA VI</h1>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="leaks.html">Filtraciones</a>
            <a href="characters.html">Personajes</a>
            <a href="map.html">Mapa</a>
            <a href="trailers.html">Trailers</a>
        </nav>
    </header>

    <section class="hero">
        <h2>MAPA DE LEONIDA</h2>
        <p>
            Explorá el mapa de GTA VI y descubrí el territorio
            donde transcurre la aventura.
        </p>
    </section>

    <main class="map-container">
        <div class="map-box">

            <a href="images/mapa.png" target="_blank">
                <img
                    src="images/mapa-leonida.png"
                    alt="Mapa de Leonida de Grand Theft Auto VI">
            </a>

            <p class="map-caption">
                Mapa de Leonida · Grand Theft Auto VI
            </p>

        </div>

        <a
            class="map-button"
            href="images/mapa-leonida.png"
            target="_blank">
            ⛶ Ver mapa en tamaño completo
        </a>
    </main>

    <footer>
        <p>GTA VI Fan Site — Proyecto no oficial</p>
    </footer>

</body>
</html>
